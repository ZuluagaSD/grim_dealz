[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "grim_dealz"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "dagster>=1.9",
    "httpx[http2]>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "tenacity>=8.3.0",
    "psycopg[binary]>=3.1.0",
    "python-dotenv>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["grim_dealz*"]
